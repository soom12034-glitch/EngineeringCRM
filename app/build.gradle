plugins { id 'com.android.application' }
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
def uploadStoreFile = System.getenv('ANDROID_UPLOAD_STORE_FILE') ?: keystoreProperties['storeFile']
def uploadStorePassword = System.getenv('ANDROID_UPLOAD_STORE_PASSWORD') ?: keystoreProperties['storePassword']
def uploadKeyAlias = System.getenv('ANDROID_UPLOAD_KEY_ALIAS') ?: keystoreProperties['keyAlias']
def uploadKeyPassword = System.getenv('ANDROID_UPLOAD_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def releaseSigningReady = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword
android {
    namespace 'com.amalaei.engineering'
    compileSdk 36
    defaultConfig {
        applicationId 'com.soom12034.engineeringcrm'
        minSdk 29
        targetSdk 36
        versionCode 25
        versionName '1.4.1'
        buildConfigField 'String', 'PRIVACY_POLICY_URL', '"https://soom12034-glitch.github.io/EngineeringCRM/privacy-policy.html"'
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
    flavorDimensions 'distribution'
    productFlavors {
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'DIRECT_CALL_LOG', 'false'
        }
        direct {
            dimension 'distribution'
            versionNameSuffix '-direct'
            buildConfigField 'boolean', 'DIRECT_CALL_LOG', 'true'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { test.java.srcDir '../tests' }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:bundlePlayRelease') && !releaseSigningReady) {
        throw new GradleException('Play release signing is required. Set ANDROID_UPLOAD_STORE_FILE, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, and ANDROID_UPLOAD_KEY_PASSWORD.')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

plugins { id 'com.android.application' }
android {
    namespace 'com.amalaei.engineering'
    compileSdk 36
    defaultConfig { applicationId 'com.soom12034.engineeringcrm'; minSdk 29; targetSdk 36; versionCode 3; versionName '1.1.0' }
    flavorDimensions 'distribution'
    productFlavors {
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'DIRECT_CALL_LOG', 'false'
        }
        direct {
            dimension 'distribution'
            applicationIdSuffix '.direct'
            versionNameSuffix '-direct'
            buildConfigField 'boolean', 'DIRECT_CALL_LOG', 'true'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { test.java.srcDir '../tests' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

plugins { id 'com.android.application' }
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
android {
    namespace 'com.amalaei.engineering'
    compileSdk 36
    defaultConfig { applicationId 'com.soom12034.engineeringcrm'; minSdk 29; targetSdk 36; versionCode 100; versionName '1.4.12' }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        upload {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['uploadStoreFile'])
                storePassword keystoreProperties['uploadStorePassword']
                keyAlias keystoreProperties['uploadKeyAlias']
                keyPassword keystoreProperties['uploadKeyPassword']
            }
        }
    }
    buildTypes {
        release {
        }
    }
    flavorDimensions 'distribution'
    productFlavors {
        play {
            dimension 'distribution'
            signingConfig signingConfigs.upload
            buildConfigField 'boolean', 'DIRECT_CALL_LOG', 'false'
        }
        direct {
            dimension 'distribution'
            applicationIdSuffix '.direct'
            versionNameSuffix '-direct'
            signingConfig signingConfigs.release
            buildConfigField 'boolean', 'DIRECT_CALL_LOG', 'true'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { test.java.srcDir '../tests' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
